# Ranger Configuration File
# ~/.config/ranger/rc.conf

### Basic UI
set show_hidden false
set draw_borders false
set mouse_enabled true
set wrap_scroll true
set scroll_offset 5
set column_ratios 1,2,3
set vcs_aware true
set external_preview true
set line_numbers false
set preview_images true
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set preview_directories true

### File listing behavior
default_linemode filename

### Vim-style navigation
map j move down
map k move up
map h move left
map l move right

### Terminal launcher at current location
map tt shell $TERMINAL

### Clipboard Integration (X11 version)
map yc shell basename %f | xclip -selection clipboard
map yC shell cat %f | xclip -selection clipboard
map ya shell for f in %f; do basename "$f"; done | xclip -selection clipboard
map yy chain console yank; shell basename %f | xclip -selection clipboard
map yp shell echo -n %c | xclip -selection clipboard

### Archive Handling via archivemount (FUSE)
# Mount archive and auto-unmount when done
map <enter> chain shell ~/.config/ranger/mount_archive.sh %f; cd /tmp/ranger_archive/$(basename %f)
