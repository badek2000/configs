# ~/.config/tmux/tmux.conf

# Core Configuration
# ================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"
set -g mouse on

# Prefix key (Ctrl-Space)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split commands bindings
bind h split-window -h
bind v split-window -v
unbind '"'
unbind %

# Quick config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Status Line Styling
# ==================
set -g status-position bottom
set -g status-bg "#1B1B1B"
set -g status-fg "#FFFFFF"
set -g status-left-length 40
set -g status-right-length 150

# Left status
set -g status-left "#[fg=#008067,bg=#1B1B1B]❐ #[fg=#FF9000]#S "

# Right status (simplified)
set -g status-right "#[fg=#008067]#H #[fg=#FF9000]:: #[fg=#008067]%Y-%m-%d #[fg=#FF9000]:: #[fg=#008067]%H:%M "

# Window Settings
# ==============
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#808080,bg=#1B1B1B]#I:#W#F "
setw -g window-status-current-format "#[fg=#008067,bg=#1B1B1B]#I:#W#F "

# Pane Settings (Invisible Borders)
# ===============================
set -g pane-active-border-style "fg=#008067,bg=#1B1B1B"
set -g pane-border-style "fg=#2A2A2A,bg=#1B1B1B"

# Copy Mode Highlighting
# ====================
set-window-option -g mode-style "fg=#1B1B1B,bg=#FF9000"

# Mouse-based Copy Mode Enhancements
# ================================
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -n MouseDragEnd1Pane if-shell -F '#{pane_in_mode}' 'send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"' 'copy-mode -M'
bind -T copy-mode-vi TripleClick1Pane send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Execute Command in All Panes
# ===========================
bind-key a run-shell "~/.config/tmux/exec_in_all_panes.sh"

# Plugin Integration
# ================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Load TPM
run '~/.config/tmux/plugins/tpm/tpm'

